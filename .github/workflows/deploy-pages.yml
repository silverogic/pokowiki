name: Build and Deploy to docs for GitHub Pages

on:
  push:
    branches:
      - master
    paths-ignore:
      - docs/**
      - .vscode/**/*
      - README.md
      - AGENTS.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs-build
  cancel-in-progress: false

jobs:
  build-and-push-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project with Next.js export
        env:
          GITHUB_ACTIONS: "true"
        run: pnpm run build

      - name: Copy build output to docs
        run: |
          rm -rf docs
          cp -r out docs
          touch docs/.nojekyll

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs
          if git diff --staged --quiet; then
            echo "No changes in docs to commit"
          else
            git commit -m "chore(deploy): update GitHub Pages docs build [skip ci]"
            git push origin master
          fi
